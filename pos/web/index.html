<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<title>Point of sale</title>
		<script>
			// An install link must install with its own manifest, whose
			// start_url carries the pairing code. posd serves both manifests.
			;(function () {
				var match = location.pathname.match(/^\/pair\/([^/]+)\/?$/)
				var link = document.createElement('link')
				link.rel = 'manifest'
				link.href = match ? '/pair/' + match[1] + '/manifest.webmanifest' : '/manifest.webmanifest'
				document.head.appendChild(link)
			})()
		</script>
		<!-- posd writes the page's brand here: its stylesheet, icons, colours
		     and #pos-brands. See src/api/web.rs. -->
	</head>
	<body>
		<script>
			// On a domain of no brand, a paired terminal starts in the brand it
			// remembered, before the first paint. See src/lib/brand.svelte.ts.
			;(function () {
				try {
					var data = JSON.parse(document.getElementById('pos-brands').textContent)
					var key = localStorage.getItem('pos:brand')
					if (data.current !== 'default' || !key || !data.brands[key]) return
					document.documentElement.dataset.brand = key
					document.querySelector('link[data-brand-css]').href = '/brands/' + key + '/brand.css'
				} catch (e) {}
			})()
		</script>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>

# posd's exclusions from the Core Rule Set, as narrow as each needs.
#
# Free text that posd stores as data and the till shows as text: a payer's
# Lightning address comment and a sale's memo. SQL keywords and shell-like
# punctuation in a note ("drop by tomorrow; select the blue one") are not
# attacks on posd, which only uses bound parameters and runs no commands.
# XSS rules still apply to them.
SecRule REQUEST_FILENAME "@rx ^/api/v1/lnurlp/[^/]+/callback$" \
	"id:10001,phase:1,pass,nolog,\
	ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:comment,\
	ctl:ruleRemoveTargetByTag=attack-rce;ARGS:comment"
SecRule REQUEST_FILENAME "@streq /api/v1/sales" \
	"id:10002,phase:1,pass,nolog,\
	ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.memo,\
	ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.memo"
# A Bolt Card's LNURL-withdraw link is a URL by design (a remote file
# inclusion pattern to the CRS). posd fetches it itself behind its own SSRF
# guard: https only, public addresses only, no redirects.
SecRule REQUEST_FILENAME "@rx ^/api/v1/sales/[^/]+/bolt-card$" \
	"id:10003,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.link"

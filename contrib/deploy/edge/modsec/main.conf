# ModSecurity for the edge's posd hosts: the engine settings, the OWASP Core
# Rule Set (Debian's modsecurity-crs, 3.3) and posd's exclusions. Blocking,
# not detection only.
Include /etc/nginx/scuttle-edge/modsec/engine.conf
Include /etc/nginx/scuttle-edge/modsec/crs-setup.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /etc/nginx/scuttle-edge/modsec/exclusions.conf

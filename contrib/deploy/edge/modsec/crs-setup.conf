# OWASP CRS 3.3 setup: anomaly scoring, blocking at the default threshold,
# paranoia level 1 (the level without routine false positives).
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1"
SecAction "id:900110,phase:1,nolog,pass,t:none,\
	setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
# posd's API uses PATCH (store) and DELETE (devices).
SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PATCH DELETE'"
SecAction "id:900220,phase:1,nolog,pass,t:none,\
	setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |text/plain|'"
SecAction "id:900990,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=337"
